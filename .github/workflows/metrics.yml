name: Metrics Dashboard
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. Base Stats, Languages, PRs, and Lines of Code
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: dpanvish
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_theme: tokyonight
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_lines: yes

      # 2. Isometric Commit Calendar
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: dpanvish
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: tokyonight
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # 3. Achievements & Trophies
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: dpanvish
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: tokyonight
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

      # 4. Coding Habits & Activity
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: dpanvish
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: tokyonight
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14

      # 5. GitHub Skyline (3D Commit City)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.skyline.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: dpanvish
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: tokyonight
          plugin_skyline: yes
          plugin_skyline_year: current-year
          plugin_skyline_frames: 60
          plugin_skyline_quality: 1
